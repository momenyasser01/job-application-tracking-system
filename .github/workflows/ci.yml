name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Real environment variables win over .env files, so this is what the
      # migration step connects to.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jats_test
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must precede lint and typecheck: both consume @jats/shared's emitted types.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Exercises drizzle.config.ts + drizzle-kit against a real Postgres, so a
      # broken migration fails the build.
      - run: pnpm --filter @jats/api db:migrate
