version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
